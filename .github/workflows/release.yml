name: ROM release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run checks
        run: ./tools/check.sh
      - name: Build ROM with pinned toolchain
        run: ./tools/build-rom.sh -j4
      - name: Publish numbered release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          # A rerun keeps its number: leave a published release intact, or
          # finish uploading a draft left behind by an interrupted attempt.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              echo "Release ${GITHUB_RUN_NUMBER} is already published."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "$GITHUB_RUN_NUMBER" \
              --notes "ROM built from commit ${GITHUB_SHA}."
          fi
          gh release upload "$tag" n64-util.z64 --clobber
          gh release edit "$tag" --draft=false
